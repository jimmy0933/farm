name: Pokemon Kids - signed Android APK (keep latest)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokemon-kids-release
  cancel-in-progress: true

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      GODOT_VERSION: '4.5.2'
      GODOT_CHANNEL: 'stable'
      GODOT_BIN: /tmp/godot
      APK_PATH: build/PokemonKids.apk
    steps:
      - name: Checkout brand-new Pokemon Kids project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate 15 Pokemon data records
        run: python3 tests/check_data.py

      - name: Fetch Pokemon artwork and Traditional Chinese font
        run: python3 tools/download_assets.py

      - name: Install Godot 4.5.2 and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl --fail --location --retry 3 "${release_url}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          curl --fail --location --retry 3 "${release_url}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -o /tmp/export_templates.tpz
          mkdir -p /tmp/pokemon-kids-templates
          unzip -q /tmp/export_templates.tpz -d /tmp/pokemon-kids-templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          cp -a /tmp/pokemon-kids-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"
          "$GODOT_BIN" --version

      - name: Install Android SDK packages and configure Godot
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          SETTINGS

      - name: Restore APK signing key from GitHub Actions Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo '::error::Missing KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS or KEY_PASSWORD'
            exit 1
          fi
          if [[ "$KEYSTORE_PASSWORD" != "$KEY_PASSWORD" ]]; then
            echo '::error::Godot Android requires equal keystore and key passwords'
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/pokemon-kids-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pokemon-kids-signing/release.keystore"
          test -s "$RUNNER_TEMP/pokemon-kids-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/pokemon-kids-signing/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/pokemon-kids-signing/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Import graphics and fonts into Godot
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Validate all screens and voice interactions
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/smoke.gd 2>&1 | tee /tmp/pokemon-kids-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:' /tmp/pokemon-kids-smoke.log; then
            echo '::error::Godot emitted script/runtime errors during smoke tests'
            exit 1
          fi

      - name: Test Pokemon battles, English labels and unclipped landscape layout
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/battle_smoke.gd 2>&1 | tee /tmp/pokemon-battle-smoke.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:' /tmp/pokemon-battle-smoke.log; then
            echo '::error::Pokemon battle, language or responsive layout regression'
            exit 1
          fi

      - name: Test five immersive Pokemon battle landscapes and attack effects
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/battle_scenery_smoke.gd 2>&1 | tee /tmp/pokemon-battle-scenery.log
          if grep -Eq 'SCRIPT ERROR:|ERROR:' /tmp/pokemon-battle-scenery.log; then
            echo '::error::Scenic battle render or visual effects regression'
            exit 1
          fi

      - name: Test finger swipes and paging in roster details and battle picker
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/pokemon_scroll_smoke.gd 2>&1 | tee /tmp/pokemon-scroll-smoke.log
          if ! grep -q '^PASS: independent Pokedex' /tmp/pokemon-scroll-smoke.log || grep -Eq 'SCRIPT ERROR:|ERROR:' /tmp/pokemon-scroll-smoke.log; then
            echo '::error::Character roster or details swipe regression'
            exit 1
          fi

      - name: Test new Pokemon official artwork, speech, Pokedex and battles
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/new_pokemon_smoke.gd 2>&1 | tee /tmp/new-pokemon-smoke.log
          if ! grep -q '^PASS: Mamoswine Spinarak Bulbasaur' /tmp/new-pokemon-smoke.log || grep -Eq 'SCRIPT ERROR:|ERROR:' /tmp/new-pokemon-smoke.log; then
            echo '::error::New Pokemon image, narration, roster or battle regression'
            exit 1
          fi

      - name: Test large tappable Pokemon type badges and narrated detail popups
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --path . --script res://tests/type_detail_smoke.gd 2>&1 | tee /tmp/pokemon-types-dialog.log
          if ! grep -q '^PASS: 15 Pokemon large tappable type badges' /tmp/pokemon-types-dialog.log || grep -Eq 'SCRIPT ERROR:|ERROR:' /tmp/pokemon-types-dialog.log; then
            echo '::error::Type icon details or popup controls regression'
            exit 1
          fi

      - name: Build signed APK and verify Android signature
        shell: bash
        run: |
          set -euo pipefail
          code=$((600 + GITHUB_RUN_NUMBER))
          sed -i -E "s@^version/code=.*@version/code=${code}@" export_presets.cfg
          sed -i -E "s@^version/name=.*@version/name=\"1.0.${GITHUB_RUN_NUMBER}\"@" export_presets.cfg
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release Android "$APK_PATH"
          test -s "$APK_PATH"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Publish latest Release and delete old Releases and tags
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="pokemon-kids-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          # gh release create first uploads to a temporary draft, then publishes.
          # A GitHub API HTTP 500 during the final transition may strand that
          # draft with a valid asset. Never mistake a draft for a public release.
          published=false
          for attempt in 1 2 3 4 5 6; do
            if ! gh release view "$tag" >/dev/null 2>&1; then
              gh release create "$tag" "$APK_PATH#PokemonKids.apk" \
                --target "$GITHUB_SHA" \
                --title "寶可夢小小探險隊 - 最新版 ${GITHUB_RUN_NUMBER}" \
                --notes '4歲語音互動寶可夢遊戲：十五隻寶可夢、醒目可點擊屬性大圖示與語音屬性百科、獨立快速滑動角色清單與明細、圖示化圖鑑、五種野外場景寶可夢回合對決與血條、電腦還擊、中文語音、英文按鈕設定、尋找猜猜樂、照顧遊戲與愛心貼紙。非官方私人作品。' \
                --latest || true
            fi
            if gh release view "$tag" >/dev/null 2>&1; then
              if ! gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq 'PokemonKids.apk'; then
                gh release upload "$tag" "$APK_PATH#PokemonKids.apk" --clobber || true
              fi
              # Force the final publish step even when upload already exists.
              gh release edit "$tag" --draft=false --latest || true
              if [[ "$(gh release view "$tag" --json isDraft --jq '.isDraft' 2>/dev/null)" == "false" ]] \
                && gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq 'PokemonKids.apk'; then
                published=true
                break
              fi
            fi
            echo "Release still missing or draft on attempt ${attempt}; retrying..."
            sleep "$((attempt*5))"
          done
          if [[ "$published" != "true" ]]; then
            echo '::error::APK built and signed, but public GitHub Release could not be confirmed'
            exit 1
          fi
          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$tag" ]]; then
              gh release delete "$old_tag" --yes --cleanup-tag || \
                gh release delete "$old_tag" --yes || echo "Warning: could not clean old release $old_tag"
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          echo "Latest published: $tag"
