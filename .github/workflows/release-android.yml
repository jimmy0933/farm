name: Build signed APK - keep latest release only

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: farm-android-release
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      GODOT_VERSION: '4.5.2'
      GODOT_CHANNEL: 'stable'
      GODOT_BIN: ${{ runner.temp }}/godot
      APK_PATH: build/AnimalAdventureIsland.apk
    steps:
      - name: Checkout Farm
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Validate source JSON
        run: python3 tests/check_data.py

      - name: Install Godot and Android export templates
        shell: bash
        run: |
          set -euo pipefail
          release_url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_CHANNEL}"
          curl --fail --location --retry 3 "${release_url}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_linux.x86_64" "$GODOT_BIN"
          chmod +x "$GODOT_BIN"
          curl --fail --location --retry 3 "${release_url}/Godot_v${GODOT_VERSION}-${GODOT_CHANNEL}_export_templates.tpz" -o /tmp/export_templates.tpz
          mkdir -p /tmp/farm_templates
          unzip -q /tmp/export_templates.tpz -d /tmp/farm_templates
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}"
          cp -a /tmp/farm_templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_CHANNEL}/"
          "$GODOT_BIN" --version

      - name: Install Android SDK packages and configure Godot
        shell: bash
        run: |
          set -euo pipefail
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.5.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          EOF

      - name: Restore release signing key from Actions Secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${KEYSTORE_BASE64}" || -z "${KEYSTORE_PASSWORD}" || -z "${KEY_ALIAS}" || -z "${KEY_PASSWORD}" ]]; then
            echo '::error::Please set KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD in Actions Secrets'
            exit 1
          fi
          if [[ "${KEYSTORE_PASSWORD}" != "${KEY_PASSWORD}" ]]; then
            echo '::error::Godot 4.5 requires equal store/key passwords for Android export'
            exit 1
          fi
          install -d -m 700 "$RUNNER_TEMP/farm-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/farm-signing/release.keystore"
          test -s "$RUNNER_TEMP/farm-signing/release.keystore"
          chmod 600 "$RUNNER_TEMP/farm-signing/release.keystore"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/farm-signing/release.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Import Godot resources
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path . --editor --quit

      - name: Validate Godot main scene and scripts
        shell: bash
        run: |
          "$GODOT_BIN" --headless --path . --script res://tests/smoke.gd

      - name: Export signed Android APK and verify signature
        shell: bash
        run: |
          set -euo pipefail
          version_code=$((405 + GITHUB_RUN_NUMBER))
          sed -i -E "s@^version/code=.*@version/code=${version_code}@" export_presets.cfg
          sed -i -E "s@^version/name=.*@version/name=\"0.6.${version_code}-rebuild\"@" export_presets.cfg
          mkdir -p build
          "$GODOT_BIN" --headless --path . --export-release Android "$APK_PATH"
          test -s "$APK_PATH"
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Publish newest release and remove ALL older releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="farm-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$tag" "$APK_PATH#AnimalAdventureIsland.apk" \
            --target "$GITHUB_SHA" \
            --title "Farm Android ${GITHUB_RUN_NUMBER} (latest)" \
            --notes 'Signed APK built with GitHub Actions Secrets. APK-reference editable reconstruction.' \
            --latest
          # Delete only after a verified, signed replacement has been published.
          while IFS= read -r old_tag; do
            if [[ -n "$old_tag" && "$old_tag" != "$tag" ]]; then
              gh release delete "$old_tag" --yes --cleanup-tag
            fi
          done < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name')
          echo "Kept only release: $tag"
